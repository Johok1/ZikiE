<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Zinxs Wiki Register</title>
        <link href="resources/loginregister/styles.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href="assets/img/favicon.png" />
        <script data-search-pseudo-elements defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/js/all.min.js" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js" crossorigin="anonymous"></script>
		  <script type="module" src="js/newjs/register/new_register.js"></script>
    </head>
    <body class="bg-primary">
		<script src="https://accounts.google.com/gsi/client" async defer></script>
        <div id="layoutAuthentication">
            <div id="layoutAuthentication_content">
                <main>
					<a href="https://www.zinxswiki.com">
						<img id="userImage" src="resources/images/Zinks_png.png" alt="" width="120" height="120" class="rounded-circle me-2">
					</a>
                    <div class="container-xl px-4">
						
                        <div class="row justify-content-center">
                            <div class="col-lg-7">
                                <!-- Basic registration form-->
                                <div class="card shadow-lg border-0 rounded-lg mt-5">
                                    <div class="card-header justify-content-center"><h3 class="fw-light my-4">Create Account</h3>
									<h5 class="hidden" style="color: red" id="error">Error Please Try Again</h5></div>
                                    <div class="card-body">
                                        <!-- Registration form-->
                                        <form>
                                            <!-- Form Row-->
                                            
                                                    
                                       
                                            <!-- Form Group (email address)            -->
											<div class="row gx-3">
												<div class="col-md-6">
													<div class="mb-3">
														<label class="small mb-1" for="inputEmailAddress">Email</label>
														<input class="form-control" id="inputEmailAddress" type="email" aria-describedby="emailHelp" placeholder="Enter email address" />
                                           			 </div>
												</div>
												<div class="col-md-6">
													 <label class="small mb-1" for="inputUsername">Username</label>
                                                        <input class="form-control" id="inputUsername" type="text" placeholder="Enter username" />
												</div>
											</div>
                                            
                                            <!-- Form Row    -->
                                            <div class="row gx-3">
                                                <div class="col-md-6">
                                                    <!-- Form Group (password)-->
                                                    <div class="mb-3">
                                                        <label class="small mb-1" for="inputPassword">Password</label>
                                                        <input class="form-control" id="inputPassword" type="password" placeholder="Enter password" />
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <!-- Form Group (confirm password)-->
                                                    <div class="mb-3">
                                                        <label class="small mb-1" for="inputConfirmPassword">Confirm Password</label>
                                                        <input class="form-control" id="inputConfirmPassword" type="password" placeholder="Confirm password" />
                                                    </div>
                                                </div>
                                            </div>
											 <div class="mb-3">
                                                <label class="small mb-1" for="inputEmailAddress">Date of Birth</label>
                                                <input class="form-control" id="inputDateOfBirth" type="date" aria-describedby="emailHelp" placeholder="Enter email address" />
                                            </div>
											<div class="mb-3">
												<label class="small mb-1" for="inputEmailAddress">Pincode</label>
												<div class = "row">
								<div class ="col-2">									
									<input id="regPincode1" maxlength="1" type="text" class="pincodeRegisterInput">
								</div>
								
								<div class ="col-2">									
									<input id="regPincode2" maxlength="1" type="text" class="pincodeRegisterInput">
								</div>
								
								<div class ="col-2">
									<input id="regPincode3" maxlength="1" type="text" class="pincodeRegisterInput">
								</div>
								
								<div class ="col-2">									
									<input id="regPincode4" maxlength="1" type="text" class="pincodeRegisterInput">
								</div>
							</div>
											</div>
                                            <!-- Form Group (create account submit)-->
                                            <a id="registerBtn" class="btn btn-primary btn-block">Create Account</a>
                                        </form>
                                    </div>
									<div id="g_id_onload"
										 data-client_id="168876054670-t977a0o6isruvtsk2ieumtak6qrio1pa.apps.googleusercontent.com"
										 data-callback="handleCredentialResponse"
										 data-context="signin"
										 data-ux_mode="popup"
										 data-login_uri=""
										 data-auto_prompt="false">
										
									</div>

									<div class="g_id_signin"
										 data-type="standard"
										 data-shape="rectangular"
										 data-theme="outline"
										 data-text="register_with"
										 data-size="large"
										 data-logo_alignment="left">
									</div>
                                    <div class="card-footer text-center">
                                        <div class="small"><a href="auth-login-basic.html">Have an account? Go to login</a></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
            <div id="layoutAuthentication_footer">
                <footer class="footer-admin mt-auto footer-dark">
                    <div class="container-xl px-4">
                        <div class="row">
                            <div class="col-md-6 small">Copyright &copy; Your Website 2021</div>
                            <div class="col-md-6 text-md-end small">
                                <a href="#!">Privacy Policy</a>
                                &middot;
                                <a href="#!">Terms &amp; Conditions</a>
                            </div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
      
		<script src="js/newjs/register/callbacks.js"></script>
    </body>
</html>
