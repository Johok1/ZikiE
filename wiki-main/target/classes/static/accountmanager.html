<div class="col">
	
<div class="row">
	
<div class="col mb-3 col-sm-2 col-md-8">
	
<div class="card" style="">
<div class="card-body">
<div class="e-profile">
<div class="row" style="height: 14vw;">
<img id="profileBanner" type="image" alt=""  src="" style="height: 14vw;background-color: #97A5B4; position: absolute">
<div class="col-12 col-sm-auto mb-3" style="">
<div>

<input id="profilePicture" type="image" alt="" class="d-flex justify-content-center align-items-center" style="position: absolute; width: 12vw; height: 12vw; background-color: rgb(233, 236, 239); border-radius: 50%" src="resources/images/homeIcon.png">
</div>
</div>

</div>
<div class="row">
<div class="col">
<label>Profile Picture:</label>
<input id="profileImageInput" type="file">
</div>
<div class="col">
<label>Profile Banner</label>
<input id="bannerImageInput" type="file">
</div>
</div>
<br>
<ul class="nav nav-tabs">
<li id="settingsTab" class="nav-item"><label style="user-select: none" class="active nav-link click">Settings</label></li>
<li id="advancedTab" class="nav-item"><label style="user-select: none" class="active nav-link click">Advanced</label></li>
</ul>
<div class="tab-content pt-3">
<div class="tab-pane active">
<div id="settingsDiv" class="">
<div class="row">
<div class="col">
<div class="row">
<div class="col">
<div>
<label>Nickname</label>
<input id="profileNickname" class="form-control" type="text" name="name" placeholder="Enter Nickname..." value="">
</div>
</div>
</div>
<div class="row">
<div class="col">
<div >
<label>Username</label>
<input id="profileUsername" class="form-control" type="text" name="username" placeholder="" value="">
</div>
</div>
</div>

<div class="row">
<div class="col mb-3">
<div >
<label>About</label>
<textarea id="profileBio" class="form-control" rows="5" placeholder="My Bio"></textarea>
</div>
</div>
</div>
</div>
</div>
<div class="row">
<div class="col">
<div>
<label>Email</label>
<input id="profileEmail" class="form-control" type="text" placeholder="user@example.com">
</div>
</div>
</div>
<div class="row">
<div class="col">
<div>
<label>Pincode</label>
<input id="profilePincode" class="form-control" type="password" placeholder="****">
</div>
</div>
</div>
</div>
	
<div id="advancedDiv" class="hidden">

<div class="mb-2">
	<b>Change Password</b></div>
	<label style="font-style: italic; color: red" id="errorText"></label>
	<label class="hidden" id ="successText" style="color: green; font-style: italic">Password Changed</label>
<div class="card-body">
<div class="row">
<div class="col">
<div>
<label>New Password</label>
<input id="newPassword" class="form-control" type="password" placeholder="••••••">
</div>
</div>
</div>
<div class="row">
<div class="col">
<div>
<label>Confirm Password</label>
<input id="confirmPassword" class="form-control" type="password" placeholder="••••••"></div>
</div>
</div>
</div>

	</div>
<div class="row">
<div class="col d-flex justify-content-end">
<button id="submitBtn" class="btn btn-primary" type="submit">Save Changes</button>
</div>
</div>
</div>
</div>
</div>
