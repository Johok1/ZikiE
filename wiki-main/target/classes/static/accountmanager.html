							<img class="homepic" style="width: 4vw" src="resources/images/homeIcon.png">

							<h4 class="" style="color: white; font-size: 2vw">Home</h4>
				</div>
				<br><br>

					    <img class="homepic" style="width: 4vw" src="resources/images/genres_icon.png">
						<h4 class="homepageTextHead" style="font-size: 2vw">Genres</h4>

				<div style="width: 8vw" id="createPageBtn"  class = "creatediv container pt-5">

<div class="container col-9" style="">
<div class="row flex-lg-nowrap">

<div class="col">
<div class="row">
<div class="col mb-3">
<div class="card">
<div class="card-body">
<div class="e-profile">
<div class="row" style="height: 14vw; width: 52vw">
<img id="profileBanner" type="image" alt=""  src="" style="height: 14vw; width:  52vw; position: absolute; background-color: #97A5B4">
<div class="col-12 col-sm-auto mb-3" style="">
<div>

<input id="profilePicture" type="image" alt="" class="d-flex justify-content-center align-items-center" style="position: absolute; width: 12vw; height: 12vw; background-color: rgb(233, 236, 239); border-radius: 50%" src="">
</div>
</div>

</div>
<div class="row">
<div class="col">
<label>Profile Picture:</label>
<input id="profileImageInput" type="file">
</div>
<div class="col">
<label>Profile Banner</label>
<input id="bannerImageInput" type="file">
</div>
</div>
<br>
<ul class="nav nav-tabs">
<li id="settingsTab" class="nav-item"><label style="user-select: none" class="active nav-link click">Settings</label></li>
<li id="advancedTab" class="nav-item"><label style="user-select: none" class="active nav-link click">Advanced</label></li>
</ul>
<div class="tab-content pt-3">
<div class="tab-pane active">
<div id="settingsDiv" class="">
<div class="row">
<div class="col">
<div class="row">
<div class="col">
<div>
<label>Nickname</label>
<input id="profileNickname" class="form-control" type="text" name="name" placeholder="Enter Nickname..." value="">
</div>
</div>
</div>
<div class="row">
<div class="col">
<div >
<label>Username</label>
<input id="profileUsername" class="form-control" type="text" name="username" placeholder="" value="">
</div>
</div>
</div>

<div class="row">
<div class="col mb-3">
<div >
<label>About</label>
<textarea id="profileBio" class="form-control" rows="5" placeholder="My Bio"></textarea>
</div>
</div>
</div>
</div>
</div>
<div class="row">
<div class="col">
<div>
<label>Email</label>
<input id="profileEmail" class="form-control" type="text" placeholder="user@example.com">
</div>
</div>
</div>
<div class="row">
<div class="col">
<div>
<label>Pincode</label>
<input id="profilePincode" class="form-control" type="password" placeholder="****">
</div>
</div>
</div>
</div>
	
<div id="advancedDiv" class="hidden">

<div class="mb-2">
	<b>Change Password</b></div>
	<label style="font-style: italic; color: red" id="errorText"></label>
	<label class="hidden" id ="successText" style="color: green; font-style: italic">Password Changed</label>
<div class="card-body">
<div class="row">
<div class="col">
<div>
<label>New Password</label>
<input id="newPassword" class="form-control" type="password" placeholder="••••••">
</div>
</div>
</div>
<div class="row">
<div class="col">
<div>
<label>Confirm Password</label>
<input id="confirmPassword" class="form-control" type="password" placeholder="••••••"></div>
</div>
</div>
</div>

	</div>
<div class="row">
<div class="col d-flex justify-content-end">
<button id="submitBtn" class="btn btn-primary" type="submit">Save Changes</button>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
<div class="col-12 col-md-3 mb-3">
<div class="card mb-3">
<div class="card-body">
<div class="px-xl-3">
<button class="btn btn-block btn-secondary">
<i class="fa fa-sign-out"></i>
<span>Logout</span>
</button>
</div>
</div>
</div>
<div class="card">
<div class="card-body">
<h6 class="card-title font-weight-bold">Support</h6>
<p class="card-text">Get fast, free help from our friendly assistants.</p>
<button type="button" class="btn btn-primary">Contact Us</button>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
