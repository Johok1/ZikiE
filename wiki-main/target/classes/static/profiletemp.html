<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap - Prebuilt Layout</title>

    <!-- Bootstrap -->
    <link href="resources/bootstrap-4.4.1.css" rel="stylesheet">

  </head>
  <body>
	  
	  <div id ="accountPopup" class="accntPopup">
							<div class="row">
		  						<div class="col-1">
									<img id="profileCancel" class="cancelImg" src="resources/images/cancel.png">
								</div>
		  					</div>
							<img class="profileBanner" src ="resources/images/homeIcon.png">
							<img class="profileImage" src="resources/images/profile.png">
							<br>
							<div class="row">
								
								<div class="col-6">
									<label>Banner</label>
									<input  type="file">
								</div>
								
								<div class="col-6">
									<label>Profile Picture</label>
									<input type="file">
								</div>
							</div>
							<br>
							<div>
								<h6 style="padding-left: 5px; cursor: default">Nickname</h6>
								<input type="text" class="profileNicknameInput" value="Terran" placeholder="Nickname">
							</div>
							
							<div>
								<h6 style="padding-left: 5px; cursor: default">Username</h6>
								<input type="text" class="profileUsernameInput" value="Johok" placeholder="Username">
							</div>
							
							<div>
								<h6 style="padding-left: 5px; cursor: default">Bio</h6>
								<textarea class="profileBioInput" cols = "55" rows="2"></textarea>
							</div>
							<hr color="#000000">
		  					<div  style="background-color: #6B6B6B; width: 300px; height: 100px; margin-left: 50px; position: absolute">
		  <div style="background-color: #191919; width: 253px; height: 70px; position: absolute; right: 25px; top: 15px;">
		  	<div style="background-color: #D8D8D8; width: 50px; height: 50px; position: absolute; top: 10px; left: 10px">
			  	<input style="background-color: transparent; width: 50px; height: 50px; padding-left: 18px;" type="text" maxlength="1" placeholder="0">
			  </div>
			<div style="background-color: #D8D8D8; width: 50px; height: 50px; position: absolute; top: 10px; left: 70px">
			  <input style="background-color: transparent; width: 50px; height: 50px; padding-left: 18px;" type="text" maxlength="1" placeholder="0">
			  </div>
			<div style="background-color: #D8D8D8; width: 50px; height: 50px; position: absolute; top: 10px; left: 130px">
			  <input style="background-color: transparent; width: 50px; height: 50px; padding-left: 18px;" type="text" maxlength="1" placeholder="0">
			  </div>
			<div style="background-color: #D8D8D8; width: 50px; height: 50px; position: absolute; top: 10px; left: 190px">
			  <input style="background-color: transparent; width: 50px; height: 50px; padding-left: 18px;" type="text" maxlength="1" placeholder="0">
			  </div>
		  
		  </div>
	  </div>
							<div class="profilePinlockSection hidden">
								<div>
								<h6 style="padding-left: 5px; cursor: default">Email</h6>
								<input type="text" class = "profilePasswordInput" placeholder="Email">
							</div>
							
							<div>
								<h6 style="padding-left: 5px; cursor: default">Password</h6>
								<input type="password" class = "profileEmailInput" placeholder="Password">
							</div>
							</div>
						</div>
	  
<!-- jQuery (necessary for Bootstrap's JavaScript plugins) --> 
    <script src="resources/jquery-3.4.1.min.js"></script>

    <!-- Include all compiled plugins (below), or include individual files as needed --> 
    <script src="resources/popper.min.js"></script>
    <script src="resources/bootstrap-4.4.1.js"></script>
  </body>
</html>
