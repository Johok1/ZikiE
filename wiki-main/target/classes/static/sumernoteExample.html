<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Summernote with Bootstrap 4</title>
 
  
		  	<link href="css/bootstrap-4.4.1.css" rel="stylesheet">
	<script src="js/jquery-3.4.1.min.js"></script>

	<!-- Include all compiled plugins (below), or include individual files as needed -->
	<script src="js/popper.min.js"></script> 
	<script src="js/bootstrap-4.4.1.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-bs4.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-bs4.min.js"></script>
	 
  </head>
  <body>
	   <style>
		 
	  </style>


	  <style>
		  .note{
			  color: black;
		  }
	  </style>
	 
    <button id="edit" class="btn btn-primary" onclick="edit()" type="button">Edit </button>
<button id="save" class="btn btn-primary" onclick="save()" type="button">Save </button>
	  <div id="editDiv" class=""><font color="grey">Example Text</font></div>

  <script>
     var edit = function() {
  		$('.summernote').summernote({focus: true, popover: {
    air: [
      ['color', ['color']],
      ['font', ['bold', 'underline', 'clear']]
    ]
  }});
	 };

	  var save = function() {
  		var markup = $('.summernote').summernote('code');
		  console.log(markup)
  		$('.summernote').summernote('destroy');
		 document.getElementById("editDiv").classList.remove("summernote")
	   };
	   var editHand = function(){
		   document.getElementById("editDiv").classList.add("summernote")
		   console.log("fire edit")
	   };	 
	   document.getElementById("editDiv").addEventListener("click",editHand)
    </script>
   
  </body>
</html>
