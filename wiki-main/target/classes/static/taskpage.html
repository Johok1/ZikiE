<!doctype html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ziki panel</title>
</head>

<body>
	<div  style="margin-left: 15px; width: 100%; height: 100%;">
	<div class="row" style="background-color: #262B2F; width: 100%">
		<a href="zikipanel.html"><h5 style=" color: white; padding-left: 5px; padding-top: 3px;">Ziki Panel</h5></a>
	</div>
	<div id="rowDiv" class="row" style="width: 100%; height: 100%">
		<div style="background-color: #343A40; position: relative; height: 1000px; width: 10%;
					padding-right: 20px; padding-left: 10px; padding-top: 10px; text-align: center; color: white" class="">
			<a href="projectmanagerv2.html"><label id="backBtn" class="click">Back</label></a>
			<label id="descBtn" class="click">Description</label>
		</div>
		
		<div class="hidden" style="position: absolute; z-index: 1; margin-top: 20px ;margin-left: 450px; background-color: #4A535C; width: 40%; height: 650px; border-radius: 8px; box-shadow: 0px 0px 10px black;">
					<div class="row">
						<h4 style="color: white; padding-top: 2%; padding-left: 20%">Description</h4>
						<img id="descBtn" src="resources/images/more_icon.png" width="25px;" height="25px" style="margin-left: 45%; margin-top: 2%" class="click">
						<div class="" style="position: absolute; z-index: 1; margin-top: 0% ;margin-left: 97%; background-color: #4A535C; width: 7%; height: 5%; border-radius: 8px; box-shadow: 0px 0px 10px black; text-align: center">
			<label style="color: white; padding-top: 10%; user-select: none" class="click">Edit</label>
		</div>
					</div>
					<hr>
					<div style="height: 80%; background-color: #1B1E21;  border: thick solid #4A535C; border-radius: 2%;overflow-y: scroll">
					<label id="descLabel" style="padding-left: 10px; padding-top: 10px;" contenteditable="true">
						Default 
					</label>
			</div>
			
				</div>
		
		
		<div id="body" style="position: relative" class="col">
			
			<div class="row"> 
	
				<div class="" style=" position: relative; margin-top: 20px ;margin-left: 30px; background-color: #4A535C; width: 40%; height: 650px; border-radius: 8px; box-shadow: 0px 0px 10px black;">
					<h4 style="color: white; text-align: center; padding-top: 5px;">General Chat</h4>
					<hr>
					<div id="generalChat" style="height: 80%; background-color: #1B1E21;  border: thick solid #4A535C; border-radius: 5%;overflow-y: scroll; overflow-x: hidden; padding-left: 10px; padding-right: 10px; word-wrap: break-word; word-break: break-all">
					
					
					</div>
					<input id="genInput" type="text" placeholder="Send a message..." style="background-color: hsla(210,10%,12%,1.00); margin-left: 10px; border: none; border-radius: 10px; color: gold; width: 95%; padding-left: 10px">
				
					<input style="color: #1B1E21" id="genImageInput" type="file">
				</div>
				
			
				<div id="mainResearchDiv" style=" margin-top: 20px; margin-left: 50px; background-color: #4A535C; width: 51%; height: 650px; border-radius: 8px; box-shadow: 0px 0px 10px black;">
					<div id="researchForum" class="row">
						<h4 id="forumHeader" style="color: white; padding-top: 2%; padding-left: 20%">Research Forum</h4>
						<img id="researchBtn" src="resources/images/add_icon_admin.png" width="25px;" height="25px" style="margin-left: 45%; margin-top: 2%" class="click">
						
						<div class="hidden" style="position: absolute; width: 170px; height: 100px; background-color: #ADADAD; margin-left: 30%">
							<label style="color: black; padding-left: 7px; padding-top:5px; font-size: 15px;">New Research Name:</label>
							<input type="text" style="width:140px; height: 25px; margin-left: 10px"></input>
							<div style="width: 70px; height: 25px; background-color: #2B2B2B; margin-left: 10px; margin-top: 5px; text-align: center; color: white; border-radius: 10px;" class="click">Submit</div>
						</div>
						
					</div>
				
					<hr>
				<div id="researchChat" class="hidden"  style="height: 85%;">
							<div style="height: 80%; background-color: #1B1E21;  border: thick solid #4A535C; border-radius: 5%;overflow-y: scroll; padding-left: 10px;">
							
							</div>
							<input type="text" placeholder="Send a message..." style="background-color: hsla(210,10%,12%,1.00); margin-left: 10px; border: none; border-radius: 10px; color: gold; width: 95%; padding-left: 10px; margin-bottom: 2%">
				</div>
					<div id="researchDiv"  class="" style="height: 85%; background-color: #1B1E21; overflow-y: scroll">
						
						
								
						<br>
					
						<div  class="hidden" style="margin-left: 100px;background-color: #373E44; width: 60%; height: 90%; overflow-y:auto; overflow-x: hidden; overflow-y: hidden">
					
							
						<div class="row" >
							<div class="col-10">
								<h5 style="text-align: center; padding-top: 10px;color: white">Research Name</h5>
							</div>
							<div class="col-1">
								<img class="click" src="resources/images/more_icon.png">
							</div>
							<div class="hidden" style="position: absolute; width: 100px; height: 70px; background-color: #ADADAD; text-align: center; margin-left: 32%; z-index: 1; margin-top: 0%;">
								<label class="click" style="color: black; padding-top:5px; font-size: 15px;">Edit Name</label>
								<label class="click" style="color: black; padding-top:5px; font-size: 15px;">Delete</label>

							</div>
						</div>
			
					
							<img class="btn" style="margin-left: 86%; width: 50px; height: 40px" src="resources/images/dropdown.png">
					<div class="" id="chatDiv">
						<div class="" style=" position: relative; margin-left: 5%; background-color: #4A535C; width: 90%; border-radius: 8px; box-shadow: 0px 0px 10px black;">
							<h4 style="color: white; text-align: center; padding-top: 5px;">Research Logs</h4>
							<hr>
							<div style="height: 80%; background-color: #1B1E21;  border: thick solid #4A535C; border-radius: 5%;overflow-y: scroll; padding-left: 10px;">
							
							</div>
							<input type="text" placeholder="Send a message..." style="background-color: hsla(210,10%,12%,1.00); margin-left: 10px; border: none; border-radius: 10px; color: gold; width: 95%; padding-left: 10px; margin-bottom: 2%">
							
				</div>
					</div>
					</div>
						<br>
						
					
					</div>
				</div>
			</div>	
						
		</div>
				
				
			</div>
			
		</div>
	</div>
	</div>

    <script src="resources/ziki panel/popper.min.js"></script>
	<script src="resources/ziki panel/jquery-3.4.1.min.js"></script>
    <script src="resources/ziki panel/bootstrap-4.4.1.js"></script>
	
	<link href="resources/ziki panel/bootstrap-4.4.1.css" rel="stylesheet">
	<link href="resources/DataTables/datatables.min.css" rel="stylesheet">
 		<script src="js/taskpage.js" ></script>
	<script src="resources/DataTables/datatables.min.js"></script>
</body>
</html>
