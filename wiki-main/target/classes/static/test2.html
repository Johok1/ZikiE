<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>test</title>
<style type="text/css">
	.text{
  position: absolute;
  color: black; 
  user-select: none;
}
	.image{
		position: absolute;
		width: 50px;
		height: 50px;
	}

</style>

<body style="background-color:grey">
	
	
  <div id ="page" style="width: 80vw; height: 80vh; background-color: white">
	  <img src="resources/images/dropdown.png" style="position: absolute" draggable="false" class="image drag">
      <label class = "text drag" style="left: 200px">Label</label>
      <label class = "text drag">Label</label>
	  <label class = "text drag">Label</label>
  </div>
	
	<label for="customRange2" class="form-label">Example range</label>
<input type="range" class="form-range" min="0" max="100" step="0.1" id="customRange2">
	
	<label id="rangeLabel">0</label>
	<script>
		document.getElementById("customRange2").addEventListener("change",this.showRange)
		function showRange(){
			let rangeLabel = document.getElementById("rangeLabel")
			let inputRange = document.getElementById("customRange2")
			rangeLabel.innerText = inputRange.value
		}
	</script>
  <button id="toggleDragBtn">
     Toggle Drag
  </button>
  <button id="toggleSelectBtn">
     Toggle Select
  </button>
	
</body>
	<script type="module" src="js/newjs/editor/test.js"></script>
