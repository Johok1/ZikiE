		<div class="wikiBody" style=" overflow-y: hidden; overflow-x: hidden;">
				<h2>Tags</h2>
			<br><br>
			<div class="row">
				<div class="col">
					<h4>Genres</h4>
					<input type="text" size="50vw" class="form-control form-control-dark">
					<div id="genresRow" class="row" style="margin: 1vw">
						
						
						</div>
				</div>
				<div class="col-3  phoneHide">
					<div class="card click" data-bs-toggle="dropdown" style="color: white; background-color:hsla(210,11%,26%,1.00); text-align: center; width: 80%; margin-top: 22%; user-select: none">Request Addition</div>
					<ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
						<li><input id="wikiNameInput" type="text" class="dropdown-item" placeholder="Request New Genre..."></li>
						<li><button style="background-color: transparent" onClick="createGenreGraphic()">Submit Changes</button></li>
		 			 </ul>
					<script>
						class GenreGraphic {
							constructor(name) {
								this.name = name
								
								this.master = document.createElement("div");
								this.master.className = "col-3";
								
								this.cardDiv = document.createElement("div");
								this.cardDiv.className = "click card";
								this.cardDiv.style.width = "80%";
								this.cardDiv.style.color = "black";
								this.cardDiv.title = this.name;
								
								this.inputField = document.createElement("input");
								this.inputField.style.textAlign = "center";
								this.inputField.style.border = "none";
								this.inputField.style.backgroundColor = "transparent";
								this.inputField.style.userSelect = "all";
								this.inputField.disabled = true;
								this.inputField.type = "text";
								this.inputField.value = this.name;

								this.cardDiv.appendChild(this.inputField);
								this.master.appendChild(this.cardDiv);
							}
						}
						function createGenreGraphic(){
							let wikiNameInput = document.getElementById("wikiNameInput")
							let genresRow = document.getElementById("genresRow")
						
							if(wikiNameInput.value != ""){
								const graphic = new GenreGraphic(wikiNameInput.value)
								genresRow.appendChild(graphic.master)
								wikiNameInput.value = ""
							}
						}
					</script>
				</div>
			</div>
				<br><br><br>
			<div class="row">
				<div class="col">
					<h4>Filter Tags</h4>
					<input type="text" size="50vw" class="form-control form-control-dark">
					<div id="tagsRow" class="row" style="margin: 1vw">
						
						
				  </div>
			  </div>
				<div class="col-3  phoneHide">
					<div class="card click"  data-bs-toggle="dropdown" style="color: white; background-color:hsla(210,11%,26%,1.00); text-align: center; width: 80%; margin-top: 22%; user-select: none">Create Filter Tag</div>
						<ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
						<li><input id="filterTagInput" type="text" class="dropdown-item" placeholder="Create New Filter Tag..."></li>
						<li><button style="background-color: transparent" onClick="createTagGraphic()">Submit Changes</button></li>
		 			 </ul>
					
					<script>
						class TagGraphic {
							constructor(name) {
								this.name = name
								
								this.master = document.createElement("div");
								this.master.className = "col-3";
								
								this.cardDiv = document.createElement("div");
								this.cardDiv.className = "click card";
								this.cardDiv.style.width = "80%";
								this.cardDiv.style.color = "black";
								this.cardDiv.title = this.name;
								this.inputField = document.createElement("input");
								this.inputField.style.textAlign = "center";
								this.inputField.style.border = "none";
								this.inputField.style.backgroundColor = "transparent";
								this.inputField.style.userSelect = "all";
								this.inputField.disabled = true;
								this.inputField.type = "text";
								this.inputField.value = this.name;

								this.cardDiv.appendChild(this.inputField);
								this.master.appendChild(this.cardDiv);
							}
						}
						function createTagGraphic(){
							let filterTagInput = document.getElementById("filterTagInput")
							let tagsRow = document.getElementById("tagsRow")
						
							if(filterTagInput.value != ""){
								const graphic = new TagGraphic(filterTagInput.value)
								tagsRow.appendChild(graphic.master)
								filterTagInput.value = ""
							}
						}
					</script>
				</div>
			</div>
			<br><br><br>
			<div class="row">

					<h4>Categories</h4>

				</div>
				<div class="col-3  phoneHide">

					<ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">

						<script>
						class CategoryGraphic {
							constructor(name) {
								this.name = name

								this.cardDiv.title = this.name;
								
								this.inputField = document.createElement("input");

								this.inputField.style.border = "none";
								this.inputField.style.backgroundColor = "transparent";
								this.inputField.style.userSelect = "all";
								this.inputField.disabled = true;
								this.inputField.type = "text";
								this.inputField.value = this.name;

								this.cardDiv.appendChild(this.inputField);
								this.master.appendChild(this.cardDiv);
							}
						}
						function createCategoryGraphic(){
							let categoryNameInput = document.getElementById("categoryNameInput")
							let categoriesRow = document.getElementById("categoriesRow")
						
							if(categoryNameInput.value != ""){

								categoriesRow.appendChild(graphic.master)
								categoryNameInput.value = ""
							}
						}
					</script>
