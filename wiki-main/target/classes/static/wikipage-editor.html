<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>page editor</title>
<link href="resources/pageeditor/bootstrap-4.4.1.css" rel="stylesheet">
<script src="resources/jquery-3.4.1.min.js"></script>
</head>

<body>

	<div style="position: fixed; width: 100px; height:10000px;" class="col-2 homepage-sidebar">
		<img style="padding-right: 10px;" width="80px" height="60px" src="resources/images/logo_collapsed.png">
		<br><br><br>
		<div  class = "row homediv">

			<div style="left: 13px;" class= "col">
				<a href="wiki_editor.html">
					<img id="home" class="homepic" height ="40px" width="40px" src="resources/images/homeIcon.png">
				</a>
			</div>
		</div>
		<br><br>
		
		<br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
		<br><br><br><br><br>
		<div  class = "row creatediv">

			<div style="left: 13px;" class= "col">
				<img  class= "createpic" height ="40px" width="40px" src="resources/images/newicon.png">
			</div>
		</div>
		
	</div>
	<div class="col">
			 <div id="page"  style="overflow: hidden;position: absolute; margin-top: 100px; margin-left: 100px; width: 1100px; height: 1500px; background-color: white;"></div>
	</div>
	<div id="toolbar">
	<div style="position: absolute; margin-top: 65px; margin-left: 900px; width: 250px;" class = "row">
		<div id="moveIcon" class="col-2 toolbarIcon" style="background-color: #262B2F;">
			<img width="20px" height="20px" src="resources/images/move_icon.png">
		</div>
		<div id="linkIcon" class="col-2 toolbarIcon" style="background-color: #262B2F;">
			<img width="30px" height="30px" src="resources/images/link_icon.png">
		</div>
		<div id="imageIcon" class="col-2 toolbarIcon" style="background-color: #262B2F;">
			<input id="myInput" type="file" class="hidden"/>
			<img width="20px" height="20px" src="resources/images/image_icon.png" onclick="$('#myInput').click();">
		</div>
		<div id="textIcon" class="col-2 toolbarIcon" style="background-color: #262B2F;">
			<img width="20px" height="20px" src="resources/images/text_icon.png">
		</div>
		<div id="selectIcon" class="col-2 toolbarIcon" style="background-color: #262B2F;">
			<img width="25px" height="20px" src="resources/images/select_icon.png">
		</div>
	</div>
		</div>
	<div id="settingsBar" style="position: absolute; margin-top: 65px; margin-left: 1120px;" class = "row">
			<div class="col-4 toolbarIcon">
			<img height="35px" width="35px" src="resources/images/toolbar_icon.png">
			</div>
			<div id="settingsBtn" class="col-4 toolbarIcon">
			
				<img height="35px" width="35px" src="resources/images/settings_icon.png">
			
			</div>
	</div>
	<div id="publishBtn" class="col publishBtn" style="text-align: center; border-radius: 10px; left: 1250px; top: 600px; position: fixed; width: 130px; height: 40px; background-color: #191919;">
		<h3 style="color: white">Publish</h3>
	</div>
	<div style="left: 1350px; top: 700px; position: fixed;" class="col">
				<img class="homepic" height ="50px" width="50px" src="resources/images/profile.png">
	</div>
	
</body>
	
<script src="js/wikipage-editor.js"></script>
<script src="resources/popper.min.js"></script>
<script src="resources/bootstrap-4.4.1.js"></script>

</html>
